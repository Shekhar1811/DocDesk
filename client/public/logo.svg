<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" width="100%" height="100%">
  <defs>
    <linearGradient id="docdeskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Medical Cross Emblem -->
  <g transform="translate(10, 8)">
    <!-- Base Glow -->
    <rect x="22" y="4" width="24" height="60" rx="7" fill="url(#docdeskGrad)" opacity="0.95" />
    <rect x="4" y="22" width="60" height="24" rx="7" fill="url(#docdeskGrad)" opacity="0.95" />
    
    <!-- Inner Pulse Line -->
    <path 
      d="M 6 34 L 20 34 L 26 22 L 34 46 L 42 16 L 48 38 L 52 34 L 62 34" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      filter="url(#glow)"
    />
  </g>

  <!-- Typography -->
  <g transform="translate(86, 0)">
    <!-- Brand Title: DocDesk -->
    <text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#ffffff">Doc</tspan><tspan fill="#38bdf8">Desk</tspan>
    </text>
    
    <!-- Subtitle: Smart Clinic & Hospital Management -->
    <text x="2" y="63" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#93c5fd" opacity="0.95">
      SMART CLINIC &amp; HOSPITAL MANAGEMENT
    </text>
  </g>
</svg>
